apply plugin: 'com.android.application'

android {
    namespace "app.motrix.android"
    compileSdkVersion 34

    defaultConfig {
        applicationId "app.motrix.android"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    aaptOptions {
        noCompress "aria2c-arm64", "aria2c-arm", "aria2c-x86_64", "aria2c-x86"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += ["$buildDir/aria2-jni"]
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
}

apply from: 'capacitor.build.gradle'

def aria2AssetDir = file("src/main/assets/engine")
def aria2JniDir = file("$buildDir/aria2-jni")

tasks.register("prepareAria2JniLibs") {
    doLast {
        copy {
            from("${aria2AssetDir}/aria2c-arm64")
            into("${aria2JniDir}/arm64-v8a")
            rename { "libaria2c.so" }
        }
        copy {
            from("${aria2AssetDir}/aria2c-arm")
            into("${aria2JniDir}/armeabi-v7a")
            rename { "libaria2c.so" }
        }
        copy {
            from("${aria2AssetDir}/aria2c-x86_64")
            into("${aria2JniDir}/x86_64")
            rename { "libaria2c.so" }
        }
        copy {
            from("${aria2AssetDir}/aria2c-x86")
            into("${aria2JniDir}/x86")
            rename { "libaria2c.so" }
        }
    }
}

preBuild.dependsOn("prepareAria2JniLibs")
